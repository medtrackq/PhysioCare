<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>วิดีโอคอลกายภาพบำบัด</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231474bf'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* หน้าวิดีโอคอลของผู้ป่วย: ไม่ต้องลงแอป ไม่ต้อง login ปุ่มใหญ่ */
    :root {
      --bg: #f3f6f9; --card: #fff; --ink: #142230; --muted: #5a6977; --line: #d9e1e8;
      --brand: #1474bf; --brand-soft: #e3f0fb; --ok: #15803d; --danger: #b42318; --danger-soft: #fdecea;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 24px; display: grid; gap: 14px; }
    h1 { font-size: 1.4rem; margin: 0; line-height: 1.3; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .muted { color: var(--muted); font-size: .92rem; }
    .when { font-size: 1.15rem; font-weight: 700; color: var(--brand); }
    .preview { position: relative; aspect-ratio: 4/3; background: #0b1620; border-radius: 14px; overflow: hidden; display: grid; place-items: center; color: #cbd5e1; }
    .preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    label.consent { display: flex; gap: 12px; align-items: flex-start; font-size: 1rem; }
    label.consent input { width: 26px; height: 26px; margin-top: 3px; flex: none; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 14px; border: 0; font: inherit; font-weight: 700; font-size: 1.1rem; cursor: pointer; background: var(--ok); color: #fff; }
    .btn:disabled { opacity: .5; }
    .btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
    .err { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 10px 12px; }
    /* ระหว่างคุย */
    .call { position: fixed; inset: 0; background: #0b1620; color: #fff; display: flex; flex-direction: column; }
    .stage { position: relative; flex: 1; overflow: hidden; }
    .stage video.remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0b1620; }
    .stage video.self { position: absolute; right: 12px; top: 12px; width: 28%; max-width: 180px; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,.6); background: #000; }
    .stage video.self.mirror { transform: scaleX(-1); }
    .status { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; background: rgba(0,0,0,.55); border-radius: 12px; padding: 10px; font-size: 1.05rem; }
    .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: #0f1d2a; }
    .bar button { min-height: 60px; border-radius: 14px; border: 0; font: inherit; font-size: .9rem; font-weight: 600; color: #fff; background: rgba(255,255,255,.14); cursor: pointer; display: grid; place-items: center; line-height: 1.2; }
    .bar button span { font-size: 1.5rem; display: block; }
    .bar button[aria-pressed="true"] { background: #b45309; }
    .bar .leave { background: var(--danger); }
    [hidden] { display: none !important; }
    button:focus-visible, input:focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
  </style>
</head>
<body>
<main id="app"><div class="card muted">กำลังโหลด…</div></main>

<script type="module">
import { CallClient, getMedia } from '/js/rtc.js';

const app = document.getElementById('app');
const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
// ไม่ให้ token ค้างในประวัติ/แถบที่อยู่ ถ้าผู้ป่วยแชร์หน้าจอ
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const H = { 'X-Call-Token': token };
const thWhen = (d) => new Date(d).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

async function api(method, path, body) {
  const res = await fetch(`/api/public/tele${path}`, { method, headers: { ...H, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error?.message || 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่'), { status: res.status });
  return data;
}

let info;
let local;
let facing = 'user';

function closedPage(title, text) {
  local?.getTracks().forEach((t) => t.stop());
  document.body.innerHTML = `<main><div class="card"><h1>${esc(title)}</h1><p>${esc(text)}</p>
    ${info?.contactPhone ? `<p class="muted">ติดต่อคลินิก โทร <b>${esc(info.contactPhone)}</b></p>` : ''}</div></main>`;
}

async function lobby() {
  const w = info.window;
  if (!w.open) {
    const msg = {
      early: `ห้องจะเปิดเวลา ${new Date(w.opensAt).toLocaleTimeString('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' })} น. — เปิดลิงก์นี้อีกครั้งเมื่อใกล้เวลา`,
      cancelled: 'นัดนี้ถูกยกเลิกแล้ว', ended: 'การโทรครั้งนี้จบแล้ว ขอบคุณครับ/ค่ะ', expired: 'ลิงก์นี้หมดเวลาแล้ว',
    }[w.reason];
    app.innerHTML = `<div class="card"><div class="muted">วิดีโอคอลกายภาพบำบัด</div><h1>คุณ${esc(info.patientFirstName)}</h1>
      <div class="when">${esc(thWhen(info.scheduledAt))} น.</div><div>กับ ${esc(info.therapistName)}</div></div>
      <div class="card">${esc(msg)}${info.contactPhone ? `<p class="muted">สอบถาม โทร <b>${esc(info.contactPhone)}</b></p>` : ''}</div>`;
    return;
  }
  app.innerHTML = `
    <div class="card"><div class="muted">วิดีโอคอลกายภาพบำบัด</div><h1>สวัสดีคุณ${esc(info.patientFirstName)}</h1>
      <div class="when">${esc(thWhen(info.scheduledAt))} น.</div>
      <div>กับ ${esc(info.therapistName)} · ประมาณ ${info.durationMin} นาที</div>
      ${info.purpose ? `<div class="muted">เรื่อง: ${esc(info.purpose)}</div>` : ''}</div>
    <div class="card" style="display:grid;gap:12px">
      <div class="preview" id="pv"><span>กดปุ่มด้านล่างเพื่อทดสอบกล้องและไมค์</span></div>
      <button class="btn ghost" id="test" type="button">📷 ทดสอบกล้องและไมค์</button>
      <div class="muted">เตรียมพื้นที่ให้ขยับตัวได้ และวางโทรศัพท์ให้นักกายภาพเห็นท่าของคุณ${info.hasProgram ? ' · เปิดโปรแกรมที่บ้านไว้ใกล้ ๆ ได้' : ''}</div>
    </div>
    <div class="card" style="display:grid;gap:12px">
      <label class="consent"><input type="checkbox" id="consent">
        <span>ฉันยินยอมรับการติดตามอาการกายภาพบำบัดผ่านวิดีโอคอล และเข้าใจว่า<b>ไม่มีการบันทึกภาพหรือเสียง</b> นักกายภาพอาจจดบันทึกผลการประเมินลงเวชระเบียน หากสัญญาณไม่ดีหรือไม่สะดวก ขอนัดมาที่คลินิกแทนได้</span></label>
      <button class="btn" id="join" type="button" disabled>เข้าห้องวิดีโอคอล</button>
      <div id="err"></div>
    </div>
    <p class="muted" style="text-align:center">ลิงก์นี้เป็นของคุณเท่านั้น กรุณาอย่าส่งต่อ</p>`;
  const consent = document.getElementById('consent');
  const join = document.getElementById('join');
  consent.addEventListener('change', () => { join.disabled = !consent.checked; });
  document.getElementById('test').addEventListener('click', async (e) => {
    const b = e.currentTarget;
    try {
      local ||= await getMedia(facing);
      const v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = local;
      document.getElementById('pv').replaceChildren(v);
      document.getElementById('err').innerHTML = '';
      b.textContent = local.getVideoTracks().length ? '✓ กล้องและไมค์พร้อม' : '✓ ไมค์พร้อม (ไม่พบกล้อง)';
    } catch (err) {
      document.getElementById('err').innerHTML = `<div class="err">${err?.name === 'NotAllowedError' ? 'ยังไม่ได้อนุญาตให้ใช้กล้อง/ไมค์ — กดอนุญาตในเบราว์เซอร์ แล้วลองใหม่' : 'เปิดกล้อง/ไมค์ไม่ได้'}</div>`;
    }
  });
  join.addEventListener('click', async () => {
    join.disabled = true;
    try {
      const j = await api('POST', '/join', { consent: true });
      local ||= await getMedia(facing);
      inCall(j.iceServers);
    } catch (err) {
      join.disabled = false;
      document.getElementById('err').innerHTML = `<div class="err">${esc(err?.name === 'NotAllowedError' ? 'ต้องอนุญาตให้ใช้กล้องและไมค์ก่อนเข้าห้อง' : err.message)}</div>`;
    }
  });
}

function inCall(iceServers) {
  document.body.insertAdjacentHTML('beforeend', `<div class="call" role="application" aria-label="วิดีโอคอล">
    <div class="stage"><video class="remote" autoplay playsinline></video><video class="self mirror" autoplay playsinline muted></video>
      <div class="status" aria-live="polite">กำลังรอ ${esc(info.therapistName)} เข้าห้อง…</div></div>
    <div class="bar">
      <button type="button" data-mic aria-pressed="false"><span>🎤</span>ไมค์</button>
      <button type="button" data-cam aria-pressed="false"><span>📷</span>กล้อง</button>
      <button type="button" data-flip><span>🔄</span>สลับกล้อง</button>
      <button type="button" class="leave" data-leave><span>📞</span>วางสาย</button>
    </div></div>`);
  app.hidden = true;
  const remote = document.querySelector('video.remote');
  const self = document.querySelector('video.self');
  const status = document.querySelector('.status');
  self.srcObject = local;
  const say = (t) => { status.hidden = !t; status.textContent = t || ''; };
  let therapistHere = false;
  const call = new CallClient({
    role: 'patient', streamUrl: '/api/public/tele/signal', signalUrl: '/api/public/tele/signal', headers: H, iceServers, localStream: local,
    on: {
      remote(stream) { remote.srcObject = stream; },
      presence(p) { therapistHere = p.staff; if (!p.staff) say(`กำลังรอ ${info.therapistName} เข้าห้อง…`); },
      state(s) {
        if (s === 'connected') say('');
        else if (s === 'connecting') say('กำลังเชื่อมต่อ…');
        else if (s === 'reconnecting' || s === 'disconnected') say('สัญญาณขาดหาย กำลังเชื่อมต่อใหม่…');
        else if (s === 'failed') say('เชื่อมต่อไม่สำเร็จ — ลองเปลี่ยนไปใช้ Wi-Fi หรือ 4G แล้วเปิดลิงก์ใหม่');
        else if (s === 'waiting' && !therapistHere) say(`กำลังรอ ${info.therapistName} เข้าห้อง…`);
      },
      closed(reason) {
        local?.getTracks().forEach((t) => t.stop());
        const text = { replaced: 'คุณเปิดห้องนี้จากอีกเครื่องหนึ่ง หน้านี้จึงปิดการเชื่อมต่อ', completed: 'นักกายภาพจบการโทรแล้ว ขอบคุณครับ/ค่ะ', cancelled: 'นัดนี้ถูกยกเลิก', hangup: 'วางสายแล้ว หากต้องการคุยต่อ เปิดลิงก์เดิมอีกครั้งได้' }[reason]
          || 'การเชื่อมต่อสิ้นสุดแล้ว';
        document.querySelector('.call')?.remove();
        closedPage('วิดีโอคอลสิ้นสุด', text);
      },
    },
  });
  call.start();
  const toggle = (btn, kind) => {
    const tracks = kind === 'audio' ? local.getAudioTracks() : local.getVideoTracks();
    const off = btn.getAttribute('aria-pressed') !== 'true';
    tracks.forEach((t) => { t.enabled = !off; });
    btn.setAttribute('aria-pressed', String(off));
    btn.innerHTML = kind === 'audio' ? `<span>${off ? '🔇' : '🎤'}</span>${off ? 'ไมค์ปิด' : 'ไมค์'}` : `<span>📷</span>${off ? 'กล้องปิด' : 'กล้อง'}`;
    call.sendState({ [kind === 'audio' ? 'micOff' : 'camOff']: off });
  };
  document.querySelector('[data-mic]').addEventListener('click', (e) => toggle(e.currentTarget, 'audio'));
  document.querySelector('[data-cam]').addEventListener('click', (e) => toggle(e.currentTarget, 'video'));
  document.querySelector('[data-flip]').addEventListener('click', async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
      const nt = s.getVideoTracks()[0];
      const old = local.getVideoTracks()[0];
      await call.replaceVideoTrack(nt);
      if (old) { local.removeTrack(old); old.stop(); }
      local.addTrack(nt);
      self.srcObject = local;
      self.classList.toggle('mirror', facing === 'user');
    } catch { facing = facing === 'user' ? 'environment' : 'user'; }
  });
  document.querySelector('[data-leave]').addEventListener('click', () => {
    if (confirm('วางสาย?')) call.hangup();
  });
}

(async () => {
  if (!token) { app.innerHTML = '<div class="card">ลิงก์ไม่ครบ กรุณาเปิดจากข้อความที่คลินิกส่งให้</div>'; return; }
  try {
    info = await api('GET', '/');
    lobby();
  } catch (err) {
    app.innerHTML = `<div class="card"><h1>เปิดลิงก์ไม่ได้</h1><p>${esc(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
